name: Build intranet image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          docker build \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ vars.VITE_GOOGLE_CLIENT_ID }}" \
            -t "ghcr.io/carlosslack/mota-intranet-nova:${{ github.sha }}" .
      - name: Verify production server
        run: |
          docker run -d --name intranet-smoke \
            -e GOOGLE_CLIENT_ID=smoke-client-id \
            -e SESSION_SECRET=smoke-session-secret \
            -p 127.0.0.1:3002:3002 \
            "ghcr.io/carlosslack/mota-intranet-nova:${{ github.sha }}"
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3002/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs intranet-smoke
          exit 1
      - name: Publish verified image
        run: docker push "ghcr.io/carlosslack/mota-intranet-nova:${{ github.sha }}"
