services:
  intranet:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    environment:
      NODE_ENV: production
      PORT: 3002
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SESSION_SECRET: ${SESSION_SECRET}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-mota.adv.br}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-ti@mota.adv.br}
      DATA_DIR: /app/data
      LANGFLOW_SERVER_URL: ${LANGFLOW_SERVER_URL}
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY}
      LANGFLOW_FINANCIAL_FLOW_ID: ${LANGFLOW_FINANCIAL_FLOW_ID}
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      - intranet-data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.mota-intranet.rule=Host(`${INTRANET_HOST}`)
      - traefik.http.routers.mota-intranet.entrypoints=websecure
      - traefik.http.routers.mota-intranet.tls=true
      - traefik.http.routers.mota-intranet.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.mota-intranet.loadbalancer.server.port=3002

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  intranet-data:
